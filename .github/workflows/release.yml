name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install Python and dependencies
        run: uv sync --locked
      - name: Check the tag matches the package version and has changelog notes
        run: |
          version="$(uv run python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match pyproject version ${version}"
            exit 1
          fi
          uv run python scripts/changelog_section.py "${version}" > release-notes.md
          cat release-notes.md
      - name: Lint, type-check, test
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest
      - name: Build wheel and sdist
        run: uv build
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "chargeback-prediction ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            --verify-tag
