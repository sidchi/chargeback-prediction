[project]
name = "chargeback-prediction"
version = "1.0.0"
description = "ML + LLM pipeline that scores card transactions for dispute risk and explains each score (synthetic data only)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Siddharth Chitambar" }]
dependencies = [
    "fastapi>=0.165.0",
    "joblib>=1.4",
    "matplotlib>=3.9",
    "numpy>=2.1",
    "scikit-learn>=1.5",
    "uvicorn>=0.32",
]

[project.scripts]
cbp = "chargeback_prediction.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chargeback_prediction"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PT", "C4"]
# Typographic characters used deliberately in docstrings and Markdown reports.
allowed-confusables = ["–", "−", "×"]

[tool.ruff.lint.pep8-naming]
# Design matrices follow the scikit-learn convention of a capital X.
ignore-names = ["X"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
# scikit-learn and joblib ship no type information.
module = ["sklearn.*", "joblib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=chargeback_prediction --cov-report=term-missing"
